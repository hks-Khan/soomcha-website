<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Soomcha · 웹사이트 준비 중</title>
  <style>
    :root { font-family: system-ui, -apple-system, sans-serif; color-scheme: light dark; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(100%, 42rem); padding: 2rem; }
    h1 { margin: 0 0 1.5rem; font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -.04em; }
    p { line-height: 1.7; }
    small { display: block; margin-top: 2rem; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Soomcha</h1>
    <p>웹사이트를 준비하고 있습니다.</p>
    <small>연결 확인을 위한 임시 페이지입니다.</small>
  </main>
</body>
</html>
